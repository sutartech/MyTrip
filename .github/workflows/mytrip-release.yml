name: MyTrip release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mytrip-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated Quick Expense shell
        run: node tools/sync-quick-expense-entry.js --check
      - name: Verify assets, syntax, manifests and version alignment
        run: node tools/verify-release.js
      - name: Run portable regression tests
        run: node --test tests/entry-transparency.test.js tests/settlement-print.test.js tests/settlement-reopen.test.js
