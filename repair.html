<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0F6E6A">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Clear MyTrip cache &amp; update</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:#FAF8F4;color:#1F2A33;font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif}
    .card{width:min(520px,100%);padding:clamp(24px,5vw,40px);border:1px solid #EFEDE7;border-radius:24px;background:#fff;box-shadow:0 20px 50px -30px rgba(31,42,51,.35)}
    .brand{display:flex;align-items:center;gap:10px;color:#0F6E6A;font-size:18px;font-weight:800}.brand i{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:#0F6E6A;color:#fff;font-style:normal}
    h1{margin:24px 0 8px;font-size:clamp(26px,6vw,34px);letter-spacing:-.8px;line-height:1.15}p{margin:0;color:#5B6574;font-size:15px;line-height:1.55}
    ul{margin:16px 0;padding:14px 16px 14px 34px;border-radius:14px;background:#F4F2EC;color:#4A5563;font-size:14px;line-height:1.7}
    button,a{display:flex;width:100%;min-height:52px;align-items:center;justify-content:center;margin-top:10px;border-radius:14px;font:inherit;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer}
    button{border:0;background:#0F6E6A;color:#fff}button:disabled{opacity:.7}a{border:1px solid #CFE5E1;background:#fff;color:#0F6E6A}
    #status{margin-top:14px;color:#17744F;font-weight:700;text-align:center;font-size:14px;min-height:20px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><i>↗</i> mytrip</div>
    <h1>Clear cache &amp; update</h1>
    <p>Use this when this browser shows an old version but Incognito shows the new one.</p>
    <ul>
      <li>Removes old app copies and the old backend address</li>
      <li>Keeps your trips, sheets, photos, username, theme and text size</li>
      <li>You will need to sign in again</li>
    </ul>
    <button id="repair" type="button">↻ Clear cache &amp; open latest</button>
    <a href="./">Back without clearing</a>
    <div id="status" role="status"></div>
  </main>
  <script>
    (function () {
      var KEEP = ["mytrip_saved_username_v2", "mytrip_text_scale_v1", "mytrip.theme", "mytrip_plan_columns_v2", "mytrip_plan_view_v1", "mytrip_print_plan_scale_v1", "mytrip_print_plan_wrap_v1", "mytrip_print_plan_layout_v1", "mytrip_print_plan_align_v1", "mytrip.welcomed.v1", "mytrip_photo_original"];
      async function run(btn) {
        var status = document.getElementById("status");
        if (btn) { btn.disabled = true; btn.textContent = "Clearing…"; }
        status.textContent = "Removing old versions…";
        try { if ("caches" in window) { var keys = await caches.keys(); await Promise.all(keys.map(function (k) { return caches.delete(k); })); } } catch (e) {}
        try { if ("serviceWorker" in navigator) { var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function (r) { return r.unregister(); })); } } catch (e) {}
        try { Object.keys(localStorage).forEach(function (k) { if (/^mytrip/i.test(k) && KEEP.indexOf(k) < 0) localStorage.removeItem(k); }); } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        status.textContent = "Done. Opening the latest MyTrip…";
        setTimeout(function () { location.replace("./index.html?fresh=" + Date.now()); }, 400);
      }
      document.getElementById("repair").addEventListener("click", function () { run(this); });
      if (/[?&]auto=1\b/.test(location.search)) run(document.getElementById("repair"));
    })();
  </script>
</body>
</html>
